name: monitoramento_mobile
description: App mobile LPR – consome a API FastAPI de monitoramento.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_mlkit_text_recognition: ^0.15.0
  google_maps_flutter: ^2.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^17.0.0
  audioplayers: ^5.2.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_bpfron.png"
  min_sdk_android: 21
  adaptive_icon_background: "#021a0d"
  adaptive_icon_foreground: "assets/logo_bpfron.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo_bpfron.png
