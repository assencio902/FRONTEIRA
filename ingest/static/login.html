<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPFRON - Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #171d14;
      --sidebar:     #26301f;
      --card:        #35422b;
      --card2:       #2b3623;
      --border:      #5a6b47;
      --accent:      #c4a64a;
      --accent2:     #dbc483;
      --text:        #f1ecd9;
      --muted:       #c7c0a4;
      --danger:      #d47460;
      --pressed:     #1c2317;
      --radius:      14px;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    /* ── Background animado ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 72% 58% at 18% 18%, rgba(219,196,131,.10) 0%, transparent 62%),
        radial-gradient(ellipse 58% 72% at 82% 22%, rgba(53,66,43,.62) 0%, transparent 66%),
        radial-gradient(ellipse 60% 64% at 50% 100%, rgba(38,48,31,.88) 0%, transparent 72%),
        linear-gradient(145deg, #131810 0%, var(--bg) 34%, #21291a 100%);
      z-index: 0;
    }
    .bg-dots {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(219,196,131,.08) 1px, transparent 1px);
      background-size: 36px 36px;
      z-index: 0;
    }
    /* Linha diagonal decorativa */
    .bg-line {
      position: fixed;
      top: 0; bottom: 0;
      left: 52%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(196,166,74,.10) 20%, rgba(219,196,131,.22) 50%, rgba(196,166,74,.10) 80%, transparent);
      z-index: 0;
    }

    /* ── Layout coluna única ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 28px 20px 38px;
      gap: 16px;
    }

    /* ── Painel branding (topo) ── */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      gap: 28px;
      margin-bottom: 0;
      transform: translateY(4px);
      margin-inline: auto;
    }
    .brand-lockup {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .logo-ring {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(26px) scale(.82);
      animation:
        crest-arrive 3.1s cubic-bezier(.19,.89,.32,1.1) .05s both,
        crest-float 6.2s ease-in-out 4.3s infinite;
    }
    /* Anel pulsante externo */
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(196,166,74,.34);
      animation: pulse-ring 3.2s ease-in-out 3.7s infinite;
    }
    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 1px solid rgba(219,196,131,.14);
      animation: pulse-ring 3.2s ease-in-out 4.2s infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: .12; transform: scale(1); }
      50%       { opacity: .7;  transform: scale(1.04); }
    }
    /* Círculo verde de fundo (igual ao sidebar) */
    .logo-bg {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, rgba(219,196,131,.10), transparent 46%),
        linear-gradient(180deg, rgba(53,66,43,.96) 0%, rgba(38,48,31,.98) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      box-shadow:
        0 0 0 3px rgba(196,166,74,.30),
        0 8px 40px rgba(0,0,0,.6);
      transform: scale(.84);
      animation: crest-core-reveal 2.3s cubic-bezier(.17,.84,.34,1.06) both;
    }
    .logo-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 28%, rgba(219,196,131,.16), transparent 32%),
        radial-gradient(circle at 72% 72%, rgba(255,170,86,.10), transparent 28%);
      filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      animation:
        crest-ember-intro 2.5s ease-out 1.6s both,
        crest-ember-flicker 5.4s ease-in-out 4.3s infinite;
    }
    .logo-bg::after {
      content: '';
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,234,170,.42) 0%, rgba(255,204,99,.20) 28%, rgba(255,146,54,.12) 46%, transparent 70%);
      mix-blend-mode: screen;
      filter: blur(20px) saturate(1.18);
      opacity: 0;
      transform: scale(.72);
      animation:
        crest-halo-intro 2.5s cubic-bezier(.2,.76,.28,1) 1.8s both,
        crest-halo-loop 5.4s ease-in-out 4.4s infinite;
      pointer-events: none;
      z-index: 3;
    }
    .logo-intro {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 44%, rgba(0,0,0,0) 34%, rgba(0,0,0,.08) 68%, rgba(0,0,0,.24) 100%),
        linear-gradient(180deg, rgba(0,0,0,.03) 0%, rgba(0,0,0,.18) 100%),
        url('/static/login-onca-intro.png');
      background-repeat: no-repeat;
      background-size: auto, auto, cover;
      background-position: center, center, center;
      box-shadow: inset 0 0 40px rgba(0,0,0,.28);
      filter: saturate(1.05) contrast(1.08) brightness(.58);
      transform: scale(.96);
      z-index: 5;
      animation: jaguar-intro 4.9s cubic-bezier(.22,.68,.18,1) both;
    }
    .logo-bg img {
      width: 252px;
      height: 252px;
      object-fit: contain;
      mix-blend-mode: normal;
      opacity: 0;
      filter: blur(16px) brightness(.62) contrast(1.06) saturate(1.4);
      position: relative;
      z-index: 4;
      transform-origin: center;
      transform: scale(.88);
      animation:
        crest-materialize 3.2s cubic-bezier(.22,.70,.22,1) 2.05s both,
        crest-breath 6.2s ease-in-out 5.5s infinite;
    }
    .brand-title {
      width: 100%;
      font-size: 3.1rem;
      font-weight: 900;
      letter-spacing: .16em;
      color: var(--accent);
      text-shadow: 0 0 24px rgba(196,166,74,.28), 0 2px 0 rgba(0,0,0,.6);
      text-align: center;
      padding-left: .16em;
    }
    .brand-sub {
      font-size: .82rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
      line-height: 1.6;
    }
    .brand-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
      margin-inline: auto;
    }
    .brand-slogan {
      font-size: .72rem;
      color: rgba(199,192,164,.62);
      letter-spacing: .06em;
      text-align: center;
      text-transform: uppercase;
      max-width: 240px;
    }

    /* ── Painel direito (formulário) ── */
    .right-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
      padding: 0;
    }
    .login-box {
      width: 100%;
      max-width: none;
    }
    .login-header {
      margin-bottom: 26px;
      text-align: center;
    }
    .login-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .1em;
      color: var(--accent2);
      text-transform: uppercase;
    }
    .login-header p {
      font-size: .74rem;
      color: rgba(199,192,164,.72);
      margin-top: 5px;
      letter-spacing: .04em;
    }
    .login-header .header-bar {
      width: 40px;
      height: 3px;
      background: var(--accent);
      border-radius: 3px;
      margin: 10px auto 0;
    }
    .card {
      background:
        linear-gradient(180deg, rgba(53,66,43,.88) 0%, rgba(38,48,31,.92) 100%);
      border: 1px solid rgba(90,107,71,.92);
      border-radius: var(--radius);
      padding: 34px 30px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.03);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: .09em;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .95rem;
      opacity: .72;
      color: var(--accent2);
      pointer-events: none;
    }
    input {
      background: rgba(43,54,35,.92);
      border: 1px solid rgba(90,107,71,.88);
      border-radius: 8px;
      color: var(--text);
      padding: 11px 13px 11px 36px;
      font-size: .92rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }
    input::placeholder { color: rgba(199,192,164,.46); }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,166,74,.16);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s, box-shadow .2s, opacity .15s;
      margin-top: 6px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(196,166,74,.24);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
      color: var(--pressed);
      box-shadow: 0 4px 16px rgba(196,166,74,.22);
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .error-msg {
      color: var(--danger);
      font-size: .8rem;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
      font-weight: 500;
    }
    .spin {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(28,35,23,.26);
      border-top-color: var(--pressed);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes crest-arrive {
      0% { opacity: 0; transform: translateY(26px) scale(.82); }
      42% { opacity: .82; }
      72% { opacity: 1; transform: translateY(-8px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes crest-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes crest-core-reveal {
      0% {
        transform: scale(.84);
        box-shadow:
          0 0 0 0 rgba(196,166,74,0),
          0 0 0 rgba(0,0,0,0);
      }
      44% {
        transform: scale(.92);
        box-shadow:
          0 0 0 2px rgba(196,166,74,.18),
          0 14px 38px rgba(0,0,0,.52);
      }
      72% {
        transform: scale(1.06);
        box-shadow:
          0 0 0 4px rgba(219,196,131,.34),
          0 0 52px rgba(255,138,46,.26),
          0 22px 54px rgba(0,0,0,.52);
      }
      100% {
        transform: scale(1);
        box-shadow:
          0 0 0 3px rgba(196,166,74,.30),
          0 8px 40px rgba(0,0,0,.6);
      }
    }
    @keyframes crest-breath {
      0%, 100% { transform: scale(1); filter: contrast(1.15) saturate(1.1) drop-shadow(0 8px 18px rgba(0,0,0,.22)); }
      50% { transform: scale(1.028); filter: contrast(1.18) saturate(1.16) drop-shadow(0 12px 24px rgba(196,166,74,.16)); }
    }
    @keyframes crest-materialize {
      0% {
        opacity: 0;
        transform: scale(.88);
        filter: blur(22px) brightness(.22) contrast(.96) saturate(1.04);
      }
      30% {
        opacity: .06;
        transform: scale(.91);
        filter: blur(17px) brightness(.34) contrast(1) saturate(1.10);
      }
      56% {
        opacity: .30;
        transform: scale(.95);
        filter: blur(10px) brightness(.54) contrast(1.06) saturate(1.14);
      }
      80% {
        opacity: .74;
        transform: scale(1.01);
        filter: blur(3px) brightness(.84) contrast(1.10) saturate(1.14) drop-shadow(0 0 12px rgba(255,176,76,.10));
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: contrast(1.15) saturate(1.1) drop-shadow(0 8px 18px rgba(0,0,0,.22));
      }
    }
    @keyframes crest-ember-intro {
      0% { opacity: 0; transform: scale(.9); }
      52% { opacity: .18; }
      100% { opacity: .52; transform: scale(1); }
    }
    @keyframes crest-ember-flicker {
      0%, 100% { opacity: .52; transform: scale(1); }
      18% { opacity: .62; }
      42% { opacity: .38; transform: scale(1.03); }
      64% { opacity: .58; }
      82% { opacity: .46; transform: scale(.99); }
    }
    @keyframes jaguar-intro {
      0% {
        opacity: 0;
        transform: scale(.86);
        filter: saturate(.94) contrast(1) brightness(.18) blur(10px);
      }
      14% {
        opacity: .84;
        transform: scale(1.04);
        filter: saturate(1.14) contrast(1.18) brightness(.62) blur(.6px);
      }
      28% {
        opacity: 1;
        transform: scale(1.01);
        filter: saturate(1.10) contrast(1.14) brightness(.70) blur(0);
      }
      56% {
        opacity: .96;
        transform: scale(1);
        filter: saturate(1.04) contrast(1.08) brightness(.64) blur(.2px);
      }
      76% {
        opacity: .58;
        transform: scale(1.01);
        filter: saturate(.98) contrast(1.02) brightness(.46) blur(1.6px);
      }
      90% {
        opacity: .18;
        transform: scale(1);
        filter: saturate(.92) contrast(.98) brightness(.32) blur(3px);
      }
      100% {
        opacity: 0;
        transform: scale(.99);
        filter: saturate(.88) contrast(.94) brightness(.22) blur(4px);
      }
    }
    @keyframes crest-halo-intro {
      0% {
        opacity: 0;
        transform: scale(.72);
      }
      60% {
        opacity: .40;
      }
      100% {
        opacity: .30;
        transform: scale(1);
      }
    }
    @keyframes crest-halo-loop {
      0%, 100% {
        opacity: .28;
        transform: scale(1);
      }
      50% {
        opacity: .42;
        transform: scale(1.08);
      }
    }

    /* ── Footer ── */
    .page-footer {
      position: fixed;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: .66rem;
      color: rgba(199,192,164,.36);
      letter-spacing: .06em;
      z-index: 2;
    }

    /* ── Responsivo mobile ── */
    @media (max-width: 500px) {
      .page { padding: 22px 16px 28px; gap: 12px; }
      .left-panel { transform: translateY(4px); }
      .left-panel { gap: 22px; margin-bottom: 0; }
      .brand-lockup { gap: 8px; }
      .logo-ring { width: 240px; height: 240px; }
      .logo-intro { inset: 0; }
      .logo-bg { width: 240px; height: 240px; }
      .logo-bg img { width: 178px; height: 178px; }
      .card { min-height: 332px; padding: 28px 22px; }
      .brand-title { font-size: 2.1rem; margin-top: 4px; }
      .bg-line { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-ring,
      .logo-ring::before,
      .logo-ring::after,
      .logo-intro,
      .logo-bg::before,
      .logo-bg img,
      .logo-bg::after {
        animation: none !important;
      }
      .logo-ring { opacity: 1; transform: none; }
      .logo-bg { transform: none; }
      .logo-intro { opacity: 0; }
      .logo-bg::before { opacity: .36; }
      .logo-bg::after { opacity: .28; transform: scale(1); }
      .logo-bg img {
        opacity: 1;
        transform: scale(1);
        filter: contrast(1.15) saturate(1.1) drop-shadow(0 8px 18px rgba(0,0,0,.22));
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-dots"></div>

  <div class="page">
    <!-- Branding: logo + título -->
    <div class="left-panel">
      <div class="logo-ring">
        <div class="logo-bg">
          <span class="logo-intro" aria-hidden="true"></span>
          <img src="/static/logo-bpfron.png.png" alt="BPFRON" onerror="this.style.display='none'">
        </div>
      </div>
      <div class="brand-lockup">
        <div class="brand-title">BPFRON</div>
        <div class="brand-divider"></div>
      </div>
    </div>

    <!-- Formulário -->
    <div class="right-panel">
      <div class="login-box">
        <div class="card">
          <div class="login-header">
            <h1>Acesso ao Sistema</h1>
            <p>Identifique-se para continuar</p>
            <div class="header-bar"></div>
          </div>
          <div class="form-group">
            <label for="username">Usuário</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input id="username" type="text" placeholder="Digite seu usuário" autocomplete="username" autofocus />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" />
            </div>
          </div>
          <button class="btn btn-primary" id="btn-login" onclick="doLogin()">Entrar</button>
          <div class="error-msg" id="login-error"></div>
        </div>
        <div class="brand-slogan" style="margin-top:18px">Sistema Integrado de Monitoramento Veicular</div>
      </div>
    </div>
  </div>

  <div class="page-footer">BPFRON &nbsp;·&nbsp; Sistema de Monitoramento &nbsp;·&nbsp; Uso Restrito</div>

  <script>
    var _AUTH_KEYS = ['bpfron_token', 'bpfron_role', 'bpfron_user', 'bpfron_fullname', 'bpfron_session_id'];

    function _authMigrateLegacyStorage() {
      _AUTH_KEYS.forEach(function(key) {
        if (sessionStorage.getItem(key)) return;
        var legacy = localStorage.getItem(key);
        if (legacy) {
          sessionStorage.setItem(key, legacy);
          localStorage.removeItem(key);
        }
      });
    }

    function _authGet(key) {
      return sessionStorage.getItem(key) || '';
    }

    function _authSetSession(data) {
      Object.keys(data).forEach(function(key) {
        sessionStorage.setItem(key, data[key] || '');
        localStorage.removeItem(key);
      });
    }
    // Se já tem token válido, redirecionar para dashboard
    (function(){
      _authMigrateLegacyStorage();
      var token = _authGet('bpfron_token');
      if (token) {
        fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(function(r){ if (r.ok) window.location.replace('/dashboard'); })
          .catch(function(){});
      }
    })();

    document.getElementById('password').addEventListener('keydown', function(e){
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    async function doLogin() {
      var btn  = document.getElementById('btn-login');
      var errEl = document.getElementById('login-error');
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value;
      errEl.textContent = '';
      if (!user || !pass) { errEl.textContent = 'Preencha usuário e senha.'; return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span> Entrando...';
      try {
        var r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        var data = await r.json();
        if (!r.ok) { errEl.textContent = data.detail || 'Erro ao autenticar.'; return; }
        _authSetSession({
          bpfron_token: data.access_token,
          bpfron_role: data.role,
          bpfron_user: data.username,
          bpfron_fullname: data.full_name,
          bpfron_session_id: data.session_id
        });
        window.location.replace('/dashboard');
      } catch(e) {
        errEl.textContent = 'Erro de conexão. Tente novamente.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      }
    }
  </script>
</body>
</html>
