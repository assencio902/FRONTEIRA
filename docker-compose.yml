services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ingest:
    build: ./ingest
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_pass
      REDIS_URL: redis://redis:6379/0
      # ── Auth / JWT ────────────────────────────────────────────────
      JWT_SECRET: "bpfron-change-me-in-production"
      JWT_EXPIRE_HOURS: "8"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin123"
      # ── Retenção / Cleanup ─────────────────────────────────────────
      CLEANUP_ENABLED: "true"
      CLEANUP_INTERVAL_SECONDS: "600"
      CLEANUP_DRY_RUN: "false"
      RETENTION_DAYS_IMAGES: "7"
      RETENTION_DAYS_EVENTS: "30"
      MAX_UPLOADS_GB: "50"
      UPLOADS_DIR: "/app/uploads"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
      - ./ingest/static:/app/static

  yolo-worker:
    build: ./yolo-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      IMAGES_DIR: /app/uploads
      YOLO_MODEL: yolov8n.pt
      YOLO_CONF: "0.35"
      PICKUP_MAX_HEIGHT_FRAC: "0.45"
      PICKUP_MAX_AREA_FRAC: "0.28"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_pass
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - ./uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # GPU — NVIDIA RTX 3050 6GB
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  camera-poller:
    build: ./camera-poller
    environment:
      INGEST_URL: http://ingest:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_pass
      RECONNECT_DELAY: "10"
      REFRESH_INTERVAL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_started
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: